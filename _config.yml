# 사이트 설정. 테마는 저장소 안의 _layouts / _includes / _sass / assets 가 전부다.

lang: ko
timezone: Asia/Seoul

title: 김도현
tagline: Since 2022
description: >-
  DevOps 엔지니어 김도현의 기술 블로그. Kubernetes, 관측성, 미들웨어, JVM 백엔드를 직접 운영하고 뜯어본 기록.
url: "https://k-diger.github.io"
baseurl: ""

author:
  name: 김도현
  email: kitten.diger@gmail.com
  github: k-diger

# jekyll-seo-tag
social:
  name: 김도현
  links:
    - https://github.com/k-diger
github:
  username: k-diger

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-last-modified-at

markdown: kramdown
kramdown:
  input: GFM
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      toc: true
      permalink: /posts/:title/

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: archive
    tag: archive
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

sass:
  style: compressed
  sourcemap: never

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - "*.mp3"
  - vendor
  - .idea
  - .vscode
  - .claude
  - CLAUDE.md
