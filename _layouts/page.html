---
layout: default
---
<div class="wrap">
  <header class="page-head">
    <h1>{{ page.title }}</h1>
    {%- if page.url == '/tags/' %}<p class="lede">태그 {{ site.tags.size }}개, 글 많은 순</p>{% elsif page.url == '/categories/' %}<p class="lede">글 {{ site.posts.size }}편, 첫 번째 분류 기준</p>{% endif %}
  </header>
  {{ content }}
</div>
