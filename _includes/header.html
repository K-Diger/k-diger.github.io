<header class="site-header">
  <div class="wrap">
    {%- if page.layout == 'home' %}
    <span></span>
    {%- else %}
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    {%- endif %}
    <nav class="site-nav" aria-label="사이트">
      <a href="{{ '/' | relative_url }}#posts">글</a>
      <a href="{{ '/categories/' | relative_url }}" {% if page.url == '/categories/' %}aria-current="page"{% endif %}>분류</a>
      <a href="{{ '/tags/' | relative_url }}" {% if page.url == '/tags/' %}aria-current="page"{% endif %}>태그</a>
      <button type="button" id="search-open" aria-haspopup="dialog">검색 <kbd>⌘K</kbd></button>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="화면 테마 바꾸기">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor"/></svg>
        <span class="theme-label">자동</span>
      </button>
    </nav>
  </div>
</header>

<dialog class="search-dialog" id="search-dialog" aria-label="글 검색">
  <div class="search-field">
    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.75" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input id="search-input" type="search" placeholder="제목, 태그, 본문으로 찾기" autocomplete="off" spellcheck="false"
      role="combobox" aria-controls="search-results" aria-expanded="true" aria-autocomplete="list"
      data-index="{{ '/assets/js/data/search.json' | relative_url }}">
    <kbd>Esc</kbd>
  </div>
  <div class="search-body">
    <p class="search-status" id="search-status" role="status" aria-live="polite"></p>
    <ul class="search-results" id="search-results" role="listbox" aria-label="검색 결과"></ul>
  </div>
  <div class="search-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> 이동</span><span><kbd>Enter</kbd> 열기</span></div>
</dialog>
